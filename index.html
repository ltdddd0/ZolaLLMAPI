<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANsouAPI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #f4f4f4;
        }
        header {
            background-color: #007bff;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }
        h1 {
            margin: 0;
            font-size: 2.5em;
        }
        p {
            font-size: 1.2em;
            margin: 1em 0;
        }
        .button {
            background-color: #28a745;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            text-decoration: none;
        }
        .button:hover {
            background-color: #218838;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            padding: 20px 0;
            background-color: #333;
            color: #fff;
        }
    </style>
</head>
<body>
    <header>
        <h1>ZolaLLMAPI</h1>
        <p>Your trusted API for managing data seamlessly.</p>
    </header>
    <div class="container">
        <h2>Features</h2>
        <ul>
            <li>Robust data management</li>
            <li>Scalable architecture</li>
            <li>Easy integration</li>
            <li>Comprehensive documentation</li>
        </ul>
        <p>Get started with PANsouAPI and enhance your application capabilities!</p>
        <a href="#get-started" class="button">Get Started</a>
    </div>
    <footer>
        <p>&copy; 2023 PANsouAPI. All rights reserved.</p>
    </footer>
    <script>
        document.querySelector('.button').addEventListener('click', function() {
            alert('Thank you for your interest in PANsouAPI! We will get back to you shortly.');
        });
    </script>
</body>
</html>
